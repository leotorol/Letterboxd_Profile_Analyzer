  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Letterboxd Stats Analyser?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is a free web app that turns your official Letterboxd data export into an interactive stats dashboard, similar to Spotify Wrapped but for your film history."
            }
          },
          {
            "@type": "Question",
            "name": "How do I export my Letterboxd data?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open Letterboxd, go to Settings, then Data, and choose Export. You will receive a ZIP file. Drop that ZIP into the app and your dashboard is generated automatically."
            }
          },
          {
            "@type": "Question",
            "name": "Is my Letterboxd data uploaded to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Your ZIP is parsed inside your browser. Only film titles and years are sent to TMDB to fetch extra metadata such as runtime, genres and posters. Your reviews, ratings and account data never leave your device."
            }
          },
          {
            "@type": "Question",
            "name": "Does the app work without a TMDB API key?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The core stats are computed from your Letterboxd export alone. TMDB only adds extra metadata like runtime, directors, genres and posters, and the app falls back gracefully when that data is unavailable."
            }
          }
        ]
      }
    </script>
